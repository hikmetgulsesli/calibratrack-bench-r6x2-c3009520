<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Instrument Editor - CalibraTrack Bench R6X2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#fadfb8",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-high": "#e6e8ea",
                        "surface-container": "#eceef0",
                        "secondary-fixed": "#d3e4fe",
                        "outline": "#75777d",
                        "surface": "#f7f9fb",
                        "outline-variant": "#c5c6cd",
                        "surface-container-highest": "#e0e3e5",
                        "secondary": "#505f76",
                        "on-tertiary-fixed-variant": "#564427",
                        "on-surface-variant": "#45474c",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#54647a",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1e",
                        "inverse-primary": "#bcc7de",
                        "inverse-surface": "#2d3133",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#d8e3fb",
                        "on-tertiary-container": "#a38c6a",
                        "on-secondary": "#ffffff",
                        "primary": "#091426",
                        "surface-dim": "#d8dadc",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "surface-container-low": "#f2f4f6",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#3c475a",
                        "primary-container": "#1e293b",
                        "tertiary-container": "#35260c",
                        "tertiary": "#1e1200",
                        "on-primary-fixed": "#111c2d",
                        "primary-fixed-dim": "#bcc7de",
                        "on-surface": "#191c1e",
                        "surface-tint": "#545f73",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary-fixed-dim": "#ddc39d",
                        "on-primary-container": "#8590a6",
                        "on-secondary-fixed": "#0b1c30",
                        "on-tertiary-fixed": "#271902",
                        "background": "#f7f9fb",
                        "secondary-container": "#d0e1fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "sm": "8px",
                        "md": "16px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "unit": "4px",
                        "xs": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "headline-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "data-mono": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Scrollbar for compact feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f7f9fb;
        }
        ::-webkit-scrollbar-thumb {
            background: #c5c6cd;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #75777d;
        }
        
        /* Focus styles for inputs */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #091426;
            box-shadow: 0 0 0 2px #d8e3fb;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex antialiased">
<!-- TopNavBar (Nav Suppressed as this is a focused task, but header remains) -->
<header class="bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center w-full px-margin-desktop h-16 fixed top-0 z-50">
<div class="flex items-center gap-md">
<button class="text-secondary hover:bg-surface-container rounded-full p-sm transition-colors" title="Go Back">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary">CalibraTrack Bench R6X2</div>
<span class="bg-tertiary-fixed text-on-tertiary-fixed-variant px-sm py-xs rounded font-label-sm text-label-sm ml-md flex items-center gap-xs hidden" id="unsaved-badge">
<span class="material-symbols-outlined text-[14px]">edit_note</span> Unsaved Changes
            </span>
</div>
<div class="flex items-center gap-md">
<button class="font-label-md text-label-md px-md py-sm border border-outline text-secondary hover:bg-surface-container rounded transition-colors">
                Cancel
            </button>
<button class="font-label-md text-label-md px-md py-sm bg-primary text-on-primary hover:bg-primary-container rounded transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">save</span> Save Instrument
            </button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-16 pt-lg pb-xl px-margin-mobile md:px-margin-desktop max-w-5xl mx-auto w-full">
<div class="mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-outline">precision_manufacturing</span>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Edit Instrument</h1>
</div>
<form class="space-y-xl" id="instrument-form">
<!-- Section 1: General Info -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
<div class="bg-surface-container-low px-md py-sm border-b border-outline-variant">
<h2 class="font-label-md text-label-md text-on-surface uppercase tracking-wider">General Information</h2>
</div>
<div class="p-lg grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="inst-name">Instrument Name <span class="text-error">*</span></label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-body-md text-on-surface transition-colors" id="inst-name" oninput="markUnsaved()" required="" type="text" value="Fluke 87V Industrial Multimeter"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="inst-model">Model Number</label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-body-md text-on-surface transition-colors" id="inst-model" oninput="markUnsaved()" type="text" value="87V"/>
</div>
<div>
<label class="block font-label-md text-label-md text-error mb-xs" for="inst-serial">Serial Number <span class="text-error">*</span></label>
<input class="w-full border border-error rounded bg-error-container/20 px-md py-sm font-data-mono text-data-mono text-on-surface transition-colors" id="inst-serial" oninput="markUnsaved()" required="" type="text" value=""/>
<p class="font-body-sm text-body-sm text-error mt-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">error</span> Serial number is required
                        </p>
</div>
</div>
</section>
<!-- Section 2: Calibration Specs -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
<div class="bg-surface-container-low px-md py-sm border-b border-outline-variant flex justify-between items-center">
<h2 class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Calibration Specifications</h2>
<button class="text-primary hover:bg-primary-fixed/20 p-xs rounded transition-colors" title="Add Spec" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
<div class="p-lg space-y-md">
<!-- Spec Row 1 -->
<div class="flex flex-col md:flex-row gap-md items-start md:items-end">
<div class="flex-1 w-full">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Parameter</label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-body-md text-on-surface" oninput="markUnsaved()" type="text" value="DC Voltage"/>
</div>
<div class="flex-1 w-full">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Range</label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-data-mono text-data-mono text-on-surface" oninput="markUnsaved()" type="text" value="0-1000V"/>
</div>
<div class="flex-1 w-full">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Accuracy / Tolerance</label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-data-mono text-data-mono text-on-surface" oninput="markUnsaved()" type="text" value="±(0.05% + 1)"/>
</div>
<button class="text-outline hover:text-error transition-colors p-sm mb-[2px]" title="Remove Spec" type="button">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Spec Row 2 -->
<div class="flex flex-col md:flex-row gap-md items-start md:items-end">
<div class="flex-1 w-full">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Parameter</label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-body-md text-on-surface" oninput="markUnsaved()" type="text" value="AC Voltage"/>
</div>
<div class="flex-1 w-full">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Range</label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-data-mono text-data-mono text-on-surface" oninput="markUnsaved()" type="text" value="0-1000V"/>
</div>
<div class="flex-1 w-full">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Accuracy / Tolerance</label>
<input class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-data-mono text-data-mono text-on-surface" oninput="markUnsaved()" type="text" value="±(0.7% + 2)"/>
</div>
<button class="text-outline hover:text-error transition-colors p-sm mb-[2px]" title="Remove Spec" type="button">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</section>
<!-- Grid for Schedule & Assignment -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Section 3: Schedule -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
<div class="bg-surface-container-low px-md py-sm border-b border-outline-variant">
<h2 class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Calibration Schedule</h2>
</div>
<div class="p-lg space-y-md">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="inst-freq">Frequency (Months) <span class="text-error">*</span></label>
<select class="w-full border border-outline-variant rounded bg-surface px-md py-sm font-body-md text-on-surface transition-colors" id="inst-freq" onchange="markUnsaved()" required="">
<option value="3">3 Months (Quarterly)</option>
<option value="6">6 Months (Semi-Annual)</option>
<option selected="" value="12">12 Months (Annual)</option>
<option value="24">24 Months (Bi-Annual)</option>
</select>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="inst-last-cal">Last Calibration Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant text-[18px]">calendar_today</span>
<input class="w-full pl-xl pr-md py-sm border border-outline-variant rounded bg-surface font-data-mono text-data-mono text-on-surface transition-colors" id="inst-last-cal" oninput="markUnsaved()" type="date" value="2023-10-15"/>
</div>
</div>
</div>
</section>
<!-- Section 4: Assignment -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
<div class="bg-surface-container-low px-md py-sm border-b border-outline-variant">
<h2 class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Assignment</h2>
</div>
<div class="p-lg">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="inst-tech">Assigned Technician</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant text-[18px]">person</span>
<select class="w-full pl-xl pr-md py-sm border border-outline-variant rounded bg-surface font-body-md text-on-surface transition-colors" id="inst-tech" onchange="markUnsaved()">
<option value="unassigned">-- Unassigned --</option>
<option selected="" value="tech1">Sarah Jenkins (L3)</option>
<option value="tech2">Marcus Roe (L2)</option>
<option value="tech3">David Chen (L1)</option>
</select>
</div>
</div>
<div class="mt-md bg-surface-container px-md py-sm rounded border border-outline-variant">
<div class="flex items-center gap-sm">
<img alt="" class="w-8 h-8 rounded-full" data-alt="" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI0iYWAc3LPY9GkbRBL9buZ8Jy4zcbs1gMdRw4E5hdNbwQKGxQcD0UF5FdglCWFPxx4-7HLtvGZv-sbrX9OiVXMtfGRYr-9at_L2Q5rofkgUlpUyNYlf56Ko57e0-nsu8ih8fbyzVAhu2jYi0kR979G0U-JmuxcrLsSDjMQww65eoFLUFdk-UKZ7cZU8oq1Y86kM1wxvGdeAmzedR4YytCyRRBRFcN6aj6Z6jjNfCmkO1MTVZMewpPVhkJUQKH0bmaH7xVMfC-VloE"/>
<div>
<p class="font-label-sm text-label-sm text-on-surface">Sarah Jenkins</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Level 3 Metrologist</p>
</div>
</div>
</div>
</div>
</section>
</div>
</form>
</main>
<script>
        function markUnsaved() {
            const badge = document.getElementById('unsaved-badge');
            if (badge) {
                badge.classList.remove('hidden');
            }
        }
    </script>
</body></html>
